name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# gh-pagesブランチへ公開する方式。
# ブランチが作られるとGitHub Pagesが自動で有効になるため、
# ワークフロートークンにPages管理権限が不要
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
