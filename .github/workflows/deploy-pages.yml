name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages設定のソースが「Deploy from a branch (gh-pages)」でも
# 「GitHub Actions」でも公開できるよう、両方式で配信する
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  # Pagesのソースが「GitHub Actions」の場合の配信経路。
  # ソースがブランチ設定の場合このジョブは失敗するが、
  # その場合はbuildジョブのgh-pages公開が有効なので無視してよい
  deploy-workflow-source:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
